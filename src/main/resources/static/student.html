<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приложение для менеджеров факультетов</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #add8e6; /<i> Светлый фон для всей страницы </i>/
    }
    h1 {
      color: #0056b3; /<i> Темно-синий цвет текста </i>/
    font-family: 'Arial', sans-serif; /<i> Шрифт Arial </i>/
    text-align: center; /<i> Центрирование текста </i>/
    margin-bottom: 30px; /<i> Отступ снизу </i>/
    font-size: 2.5rem; /<i> Размер шрифта </i>/
    text-shadow: 1px 1px 2px rgba(1, 1, 0, 0.2); /<i> Тень для текста </i>/
    }
    .btn {
      font-size: 1.2rem; /<i> Увеличенный размер шрифта для кнопок </i>/
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h1>Приложение для менеджеров факультетов</h1>

  <button class="btn btn-primary btn-block mb-3" id="getAllStudents">Получить список всех студентов</button>
  <button class="btn btn-info btn-block mb-3" id="getStudentById">Получить информацию о студенте по ID</button>
  <button class="btn btn-success btn-block mb-3" id="createStudent">Создать данные нового студента</button>
  <button class="btn btn-warning btn-block mb-3" id="updateStudent">Обновить данные студента по ID</button>
  <button class="btn btn-danger btn-block mb-3" id="deleteStudent">Удалить студента по ID</button>

  <div id="message" class="mt-3"></div>
</div>

<script>
  document.getElementById('getAllStudents').addEventListener('click', () => {
    window.location.href = 'students.html';
  });

  document.getElementById('getStudentById').addEventListener('click', () => {
    window.location.href = 'studentById.html';
  });

  document.getElementById('createStudent').addEventListener('click', () => {
    window.location.href = 'createStudent.html';
  });

  document.getElementById('updateStudent').addEventListener('click', () => {
    window.location.href = 'updateStudent.html';
  });

  document.getElementById('deleteStudent').addEventListener('click', () => {
    window.location.href = 'deleteStudent.html';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      background-color: #add8e6; / Светлый фон для всей страницы /
    }
    .header {
      display: flex;
      justify-content: center; / Центрирование по горизонтали /
    align-items: center; / Центрирование по вертикали, если нужно /
    height: 100px; / Высота контейнера для заголовка /
    }
    h1 {
      color: #0056b3; / Темно-синий цвет текста /
    font-family: 'Times New Roman', serif; / Шрифт /
    margin: 0; / Убираем отступы по умолчанию /
    font-size: 2.5rem; / Размер шрифта /
    text-shadow: 1px 1px 2px rgba(1, 1, 0, 0.2); / Тень для текста /
    }
    .btn {
      font-size: 1.2rem; / Увеличенный размер шрифта для кнопок /
    }
    .btn-purple {
      background-color: #800080; / Фиолетовый цвет для кнопки /
    color: white; / Белый цвет текста /
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <div class="header">
    <h1>Приложение для менеджеров факультета</h1> <!-- Заголовок по центру -->
  </div>

  <button class="btn btn-primary btn-block mb-3" id="getAllStudents">Получить список всех студентов</button>
  <button class="btn btn-info btn-block mb-3" id="getStudentById">Получить информацию о студенте по ID</button>
  <button class="btn btn-success btn-block mb-3" id="createStudent">Создать данные нового студента</button>
  <button class="btn btn-warning btn-block mb-3" id="updateStudent">Обновить данные студента по ID</button>
  <button class="btn btn-danger btn-block mb-3" id="deleteStudent">Удалить студента по ID</button>
  <button class="btn btn-purple btn-block mb-3" id="admin">Панель администратора</button> <!-- Фиолетовая кнопка -->
  <div id="message" class="mt-3"></div>
</div>

<script>
  document.getElementById('getAllStudents').addEventListener('click', () => {
    window.location.href = 'students.html';
  });

  document.getElementById('getStudentById').addEventListener('click', () => {
    window.location.href = 'studentById.html';
  });

  document.getElementById('createStudent').addEventListener('click', () => {
    window.location.href = 'createStudent.html';
  });

  document.getElementById('updateStudent').addEventListener('click', () => {
    window.location.href = 'updateStudent.html';
  });

  document.getElementById('deleteStudent').addEventListener('click', () => {
    window.location.href = 'deleteStudent.html';
  });

  document.getElementById("admin").addEventListener("click", function () {
    window.location.href = 'admin.html'; // Путь на страницу администратора
  });
</script>
</body>
</html>
